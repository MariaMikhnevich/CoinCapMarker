name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: pages
    cancel-in-progress: true

# GITHUB_TOKEN needs these to publish a Pages deployment:
# read the repo, write the Pages site, and authenticate via OIDC (id-token).
permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            # Actions are pinned to full commit SHAs (immutable), with the
            # major version kept in a comment. Dependabot (.github/dependabot.yml)
            # opens PRs to move the pins when new versions are released.
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            # Secrets arrive as environment variables: npm's prebuild hook
            # (scripts/generate-env.mjs) turns them into env.generated.ts,
            # which src/environments/environment.ts imports.
            - run: npm run build
              env:
                  COINCAP_API_KEY: ${{ secrets.COINCAP_API_KEY }}
                  COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

            - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
            - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
              with:
                  path: dist/coincapmarker/browser

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
